name: Feature request
description: 改善案や新しい機能を提案する
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: どんな困りごとを解きたいですか。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: どんな形がよさそうですか。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: 他に考えた案があれば書いてください。
